# Docker Compose for Local Development
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: hvpe-portal-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://hvpe:hvpe_dev_password@postgres:5432/hvpe_portal_dev
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HVPE_OPENAI_API_KEY=${HVPE_OPENAI_API_KEY}
      - OPTR_PASSCODE=billionaire
      - LOG_LEVEL=debug
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - postgres
    networks:
      - hvpe-network
    command: npm run dev

  postgres:
    image: pgvector/pgvector:pg16
    container_name: hvpe-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=hvpe
      - POSTGRES_PASSWORD=hvpe_dev_password
      - POSTGRES_DB=hvpe_portal_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - hvpe-network

networks:
  hvpe-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
