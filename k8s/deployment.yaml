apiVersion: apps/v1
kind: Deployment
metadata:
  name: hvpe-cloud-portal
  namespace: default
  labels:
    app: hvpe-cloud-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hvpe-cloud-portal
  template:
    metadata:
      labels:
        app: hvpe-cloud-portal
    spec:
      containers:
      - name: hvpe-cloud-portal
        image: ghcr.io/bickfordd-bit/hvpe-cloud-portal:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: HVPE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: hvpe-secrets
              key: openai-api-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hvpe-secrets
              key: database-url
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hvpe-secrets
              key: nextauth-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hvpe-cloud-portal
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: hvpe-cloud-portal
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hvpe-cloud-portal
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - hvpe.cloud
    - www.hvpe.cloud
    secretName: hvpe-tls
  rules:
  - host: hvpe.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hvpe-cloud-portal
            port:
              number: 80
