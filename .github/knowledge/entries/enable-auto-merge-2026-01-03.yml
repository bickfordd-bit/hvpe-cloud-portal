coaching_notes: |
  Auto-merge workflows are powerful but require careful setup to avoid shipping broken code.
  
  Prerequisites for safe auto-merge:
  1. ✅ Comprehensive test suite with high coverage
  2. ✅ Linting and type checking enforced
  3. ✅ Build passes consistently
  4. ✅ Code review process in place (even if automated)
  5. ✅ Rollback mechanism ready
  
  Quality gates to include:
  - All tests pass (unit, integration, e2e)
  - No TypeScript errors
  - Linting passes
  - Security scans pass (no new vulnerabilities)
  - Code review approval (1+ reviewers)
  - Branch up-to-date with base
  
  Monitoring requirements:
  - Track merge frequency and success rate
  - Alert on failed auto-merges
  - Review merged PRs periodically
  - Track production incidents correlated with auto-merged PRs
  
  Red flags that indicate auto-merge not ready:
  - ❌ Flaky tests (intermittent failures)
  - ❌ Inconsistent build results
  - ❌ Manual testing still required
  - ❌ No rollback process
  - ❌ Team lacks confidence in CI
  
  Rollback strategy:
  - Immediate: Revert commit + force push (breaks history, use sparingly)
  - Safe: Create revert PR + auto-merge it (preserves history)
  - Feature flags: Disable feature without code change
  
  Evolution path:
  1. Start: Manual review + manual merge
  2. Level 1: Manual review + auto-merge after approval
  3. Level 2: Auto-review + auto-merge for low-risk changes
  4. Level 3: Continuous deployment to production
  
  This repo is at Level 2 - manual review still required, but merge is automated after approval + checks pass.

