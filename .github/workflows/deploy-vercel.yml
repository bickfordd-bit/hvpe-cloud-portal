name: Deploy to Vercel (DEPRECATED - Use master-deploy.yml)

# ⚠️  DEPRECATION NOTICE
# This workflow is being replaced by the unified master-deploy.yml
# Currently running in parallel for monitoring (Phase 1)
# Will be archived after 2 weeks of successful master-deploy runs
# See .github/workflows/archive/README.md for details

on:
  push:
    branches:
      - main
      - mobile
  pull_request:
    branches:
      - main
      - mobile

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure LICENSE_SESSION_SECRET is set
        run: |
          if [ -z "${{ secrets.LICENSE_SESSION_SECRET }}" ]; then
            echo "⚠️  WARNING: LICENSE_SESSION_SECRET not set in GitHub secrets"
            echo "    Add it to secrets for Jake instance license validation to work"
          else
            echo "✅ LICENSE_SESSION_SECRET is configured"
          fi

      - name: Build Project Artifacts
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Deployed to Vercel: ${{ steps.deploy.outputs.url }}`
            })

      - name: Run smoke tests
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Testing: $URL/api/health"
          sleep 5
          curl -f "$URL/api/health" || echo "⚠️  Health check (may not be available)"
          echo "✅ Deployment complete"
