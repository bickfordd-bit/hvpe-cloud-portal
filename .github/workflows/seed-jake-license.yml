name: Seed Jake License (Production)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to seed'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  seed-jake-license:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed Jake License
        run: |
          echo "🌱 Seeding Jake license to ${{ github.event.inputs.environment }}..."
          DATABASE_URL="${{ secrets.DATABASE_URL }}" npx ts-node scripts/seed-jake-license.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify License
        run: |
          echo "✅ Jake license seeded successfully"
          echo "License key: BICK-JAKE-LIFETIME-0001"
          echo "Role: JAKE"
          echo "Mode: JAKE_BUILD"
          echo "Tier: LIFETIME"

      - name: Slack notification (optional)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Jake license seed to ${{ github.event.inputs.environment }}: ${{ job.status }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
