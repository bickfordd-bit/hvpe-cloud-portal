name: Auto-merge Copilot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'copilot' ||
      contains(github.event.pull_request.labels.*.name, 'copilot-agent') ||
      startsWith(github.head_ref, 'copilot/')

    steps:
      - name: Check PR eligibility
        id: check-eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Check if PR is from copilot
            const isCopilotPR =
              pr.user.login === 'copilot' ||
              pr.labels.some(label => label.name === 'copilot-agent') ||
              pr.head.ref.startsWith('copilot/');

            console.log('PR eligibility check:');
            console.log(`- Author: ${pr.user.login}`);
            console.log(`- Labels: ${pr.labels.map(l => l.name).join(', ')}`);
            console.log(`- Head ref: ${pr.head.ref}`);
            console.log(`- Is Copilot PR: ${isCopilotPR}`);

            if (!isCopilotPR) {
              console.log('❌ Not a Copilot PR, skipping auto-merge');
              core.setOutput('eligible', 'false');
              return;
            }

            // Check if PR is draft
            if (pr.draft) {
              console.log('❌ PR is draft, skipping auto-merge');
              core.setOutput('eligible', 'false');
              return;
            }

            // Check if no-auto-merge flag is present
            if (pr.title.includes('[no-auto-merge]')) {
              console.log('❌ PR has [no-auto-merge] flag, skipping');
              core.setOutput('eligible', 'false');
              return;
            }

            console.log('✅ PR is eligible for auto-merge');
            core.setOutput('eligible', 'true');

      - name: Comment - Auto-merge initiated
        if: steps.check-eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🤖 Copilot Auto-merge status')
            );

            const message = `## 🤖 Copilot Auto-merge status

            ✅ Auto-merge initiated for Copilot PR

            **Status**: Waiting for required checks to pass
            - Lint checks
            - Build verification
            - Test suite

            Once all checks pass, this PR will be automatically approved and merged with squash strategy.

            > Intent → Reality: Zero-approval execution enabled
            > To disable auto-merge, add \`[no-auto-merge]\` to the PR title.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }

      - name: Wait for checks
        if: steps.check-eligibility.outputs.eligible == 'true'
        uses: actions/github-script@v7
        id: wait-checks
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const requiredChecks = ['lint', 'build', 'test'];
            const maxAttempts = 60; // 30 minutes max wait
            const delayMs = 30000; // 30 seconds between checks

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
              });

              console.log(`Attempt ${attempt + 1}/${maxAttempts}: Checking status...`);

              const relevantChecks = checkRuns.check_runs.filter(run =>
                requiredChecks.some(req => run.name.toLowerCase().includes(req))
              );

              if (relevantChecks.length === 0) {
                console.log('No checks found yet, waiting...');
                await new Promise(resolve => setTimeout(resolve, delayMs));
                continue;
              }

              const allCompleted = relevantChecks.every(run =>
                run.status === 'completed'
              );

              if (!allCompleted) {
                console.log('Checks still running, waiting...');
                await new Promise(resolve => setTimeout(resolve, delayMs));
                continue;
              }

              const allPassed = relevantChecks.every(run =>
                run.conclusion === 'success'
              );

              if (!allPassed) {
                const failedChecks = relevantChecks
                  .filter(run => run.conclusion !== 'success')
                  .map(run => `- ${run.name}: ${run.conclusion}`)
                  .join('\n');

                core.setOutput('checks_passed', 'false');
                core.setOutput('failed_checks', failedChecks);
                console.log('❌ Some checks failed:\n' + failedChecks);
                return;
              }

              console.log('✅ All required checks passed!');
              core.setOutput('checks_passed', 'true');
              return;
            }

            core.setOutput('checks_passed', 'timeout');
            console.log('⏱️ Timeout waiting for checks');

      - name: Comment - Checks failed
        if: steps.wait-checks.outputs.checks_passed == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Auto-merge blocked

              Required checks failed. Please review the workflow logs:

              ${{ steps.wait-checks.outputs.failed_checks }}

              [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });
            core.setFailed('Required checks failed');

      - name: Comment - Timeout
        if: steps.wait-checks.outputs.checks_passed == 'timeout'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⏱️ Auto-merge timeout

              Checks are taking longer than expected. Auto-merge will retry on next push.

              [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

      - name: Auto-approve PR
        if: steps.wait-checks.outputs.checks_passed == 'true'
        run: |
          gh pr review "$PR_URL" --approve --body "✅ Auto-approved by Copilot workflow - all checks passed"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.wait-checks.outputs.checks_passed == 'true'
        run: |
          gh pr merge "$PR_URL" --auto --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment - Auto-merge enabled
        if: steps.wait-checks.outputs.checks_passed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ Auto-merge enabled

              All required checks passed! This PR will merge automatically.

              **Merge strategy**: Squash and merge
              **Branch cleanup**: Branch will be deleted after merge

              🎉 Intent progressed to realization without manual approval!`
            });

  notify-merge-success:
    name: Notify Merge Success
    runs-on: ubuntu-latest
    needs: auto-merge
    if: success()
    steps:
      - name: Comment - Merge successful
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🎉 Copilot PR auto-merged successfully!

              Changes have been merged to \`${{ github.event.pull_request.base.ref }}\`.

              **Commit**: ${{ github.event.pull_request.head.sha }}
              **Merged by**: Copilot auto-merge workflow

              ✅ Intent → Reality: Execution complete without approval gates`
            });
