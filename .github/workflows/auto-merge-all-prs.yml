name: Universal Auto-Merge All PRs

on:
  pull_request:
    branches: [main, mobile, ui-redesign-v1]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: write

jobs:
  auto-approve:
    name: Auto-Approve PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    steps:
      - name: Auto-approve PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;
            
            console.log(`Auto-approving PR #${prNumber} by ${prAuthor}`);
            
            try {
              // Check if already approved by this bot
              const reviews = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              const botApproval = reviews.data.find(
                r => r.user.login === 'github-actions[bot]' && r.state === 'APPROVED'
              );
              
              if (botApproval) {
                console.log('PR already approved by bot');
                return;
              }
              
              // Approve the PR
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: '✅ Auto-approved by automation system. PR will auto-merge when all status checks pass.'
              });
              
              console.log('✅ PR approved successfully');
            } catch (error) {
              console.error('Error approving PR:', error);
              throw error;
            }

  enable-auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    needs: auto-approve
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    steps:
      - name: Enable auto-merge with squash
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            
            console.log(`Enabling auto-merge for PR #${prNumber}`);
            
            try {
              // Check if auto-merge is already enabled
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              if (pr.data.auto_merge) {
                console.log('Auto-merge already enabled');
                return;
              }
              
              // Enable auto-merge with squash strategy
              await github.rest.pulls.updateBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              }).catch(() => {
                console.log('Branch already up to date or cannot be updated');
              });
              
              // Enable auto-merge
              await github.graphql(`
                mutation {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: "${pr.data.node_id}",
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                        mergeMethod
                      }
                    }
                  }
                }
              `);
              
              console.log('✅ Auto-merge enabled with squash strategy');
              
              // Add comment to PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '🤖 **Auto-merge enabled!**\n\nThis PR will automatically merge when:\n- ✅ All required status checks pass\n- ✅ Branch is up to date\n- ✅ No merge conflicts exist\n\nMerge strategy: **Squash and merge**'
              });
              
            } catch (error) {
              console.error('Error enabling auto-merge:', error);
              // Non-critical error - PR can still be manually merged
              console.log('⚠️ Could not enable auto-merge. This may be due to repository settings.');
            }

  notify-on-merge:
    name: Notify on Successful Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Create success notification issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            const body = `## ✅ PR Auto-Merged Successfully
            
            **PR:** #${pr.number} - ${pr.title}
            **Author:** @${pr.user.login}
            **Branch:** \`${pr.head.ref}\` → \`${pr.base.ref}\`
            **Merged at:** ${new Date().toISOString()}
            **Commit:** ${pr.merge_commit_sha}
            
            ### Changes
            - ${pr.additions} additions
            - ${pr.deletions} deletions
            - ${pr.changed_files} files changed
            
            ### Links
            - [View PR](${pr.html_url})
            - [View Commit](${pr.html_url}/commits/${pr.merge_commit_sha})
            
            ---
            *This is an automated notification from the PR automation system.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `✅ PR #${pr.number} auto-merged: ${pr.title}`,
              body: body,
              labels: ['auto-merge', 'notification', 'success']
            });
            
            console.log('✅ Success notification issue created');

  notify-on-failure:
    name: Notify on CI Failure
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'check_suite' &&
      github.event.check_suite.conclusion == 'failure' &&
      github.event.check_suite.pull_requests[0] != null
    steps:
      - name: Create failure notification issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checkSuite = context.payload.check_suite;
            const pr = checkSuite.pull_requests[0];
            
            if (!pr) {
              console.log('No PR associated with this check suite');
              return;
            }
            
            // Get full PR details
            const prDetails = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            const body = `## ❌ CI Checks Failed - Auto-Merge Blocked
            
            **PR:** #${pr.number} - ${prDetails.data.title}
            **Author:** @${prDetails.data.user.login}
            **Branch:** \`${prDetails.data.head.ref}\` → \`${prDetails.data.base.ref}\`
            **Check Suite:** ${checkSuite.app.name}
            **Status:** ${checkSuite.conclusion}
            
            ### Failed Checks
            The following checks must pass before auto-merge:
            - Check suite: ${checkSuite.app.name}
            - Conclusion: **${checkSuite.conclusion}**
            
            ### Action Required
            1. Review the failed checks in the PR
            2. Fix the issues
            3. Push new commits to trigger CI again
            
            ### Links
            - [View PR](${prDetails.data.html_url})
            - [View Checks](${prDetails.data.html_url}/checks)
            
            ---
            *This is an automated notification from the PR automation system.*
            *Auto-merge will proceed automatically once all checks pass.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ PR #${pr.number} CI failed: ${prDetails.data.title}`,
              body: body,
              labels: ['auto-merge', 'notification', 'failure', 'ci-failure']
            });
            
            // Also comment on the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '❌ **CI checks failed!** Auto-merge is blocked until all checks pass. See the checks tab for details.'
            });
            
            console.log('✅ Failure notification issue created');
