name: Prisma Migrate Deploy

on:
  push:
    branches:
      - main
      - mobile

concurrency:
  group: prisma-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check if DATABASE_URL is configured
        id: check_db
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️  DATABASE_URL is not configured - migrations will be skipped"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ DATABASE_URL is configured - running migrations"
          fi

      - name: Run Prisma migrate deploy
        if: steps.check_db.outputs.configured == 'true'
        run: npm run migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Skip migrations (no DATABASE_URL)
        if: steps.check_db.outputs.configured == 'false'
        run: |
          echo "✅ Skipped migrations successfully"
          echo "This is expected behavior - Bickford works without a database"
          echo "Database features (AI logs, licenses) are optional"
