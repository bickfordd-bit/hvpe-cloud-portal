name: Prisma Migrate Deploy

on:
  push:
    branches:
      - ui-redesign-v1
      - main

concurrency:
  group: prisma-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrate deploy
        run: npm run migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  skip-migrate:
    runs-on: ubuntu-latest
    if: ${{ secrets.DATABASE_URL == '' }}
    steps:
      - name: Skip migration (DATABASE_URL not configured)
        run: |
          echo "ℹ️  DATABASE_URL is not configured - skipping Prisma migrations"
          echo "This is expected if you're running without a database (Bickford works fine without it)"
          echo "To enable database features, add DATABASE_URL to repository secrets"
