name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations'
        required: true
        type: choice
        options:
          - production
          - staging
          - development

jobs:
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma generate
      
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      
      - name: Verify schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma validate
      
      - name: Create ledger entry
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p .bick/ledger/$DATE
          cat > .bick/ledger/$DATE/migration-${{ github.run_id }}.json << EOF
          {
            "id": "migration-${{ github.run_id }}",
            "ts": "$(date -Iseconds)",
            "kind": "database-migration",
            "subject": "${{ inputs.environment }}",
            "payload": {
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "actor": "${{ github.actor }}"
            },
            "hash": "migration-$(date +%s)",
            "parentId": null
          }
          EOF
      
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .bick/ledger/
          git commit -m "chore: add migration ledger entry [skip ci]" || echo "No changes"
          git push || echo "Push failed (non-critical)"
