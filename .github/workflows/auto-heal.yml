name: Auto-Heal System

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
  # REMOVED: push trigger to prevent infinite loops

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  NODE_VERSION: '18.x'

jobs:
  # Job 1: Dependency Security Updates
  dependency-updates:
    name: Auto-fix Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit fix
        id: audit
        run: |
          echo "vulnerabilities_before=$(npm audit --json | jq '.metadata.vulnerabilities.total // 0')" >> $GITHUB_OUTPUT
          npm audit fix --force || true
          echo "vulnerabilities_after=$(npm audit --json | jq '.metadata.vulnerabilities.total // 0')" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create fix PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix(deps): auto-fix security vulnerabilities'
          branch: auto-heal/dependency-fixes
          delete-branch: true
          title: '🔒 Auto-fix: Security vulnerabilities'
          body: |
            ## 🤖 Automated Dependency Fixes
            
            This PR was automatically generated by the auto-heal system.
            
            **Vulnerabilities before:** ${{ steps.audit.outputs.vulnerabilities_before }}
            **Vulnerabilities after:** ${{ steps.audit.outputs.vulnerabilities_after }}
            
            ### Changes
            - Ran `npm audit fix` to resolve security issues
            - Updated dependencies to secure versions
            
            ### Testing
            All tests will run automatically. PR will auto-merge if tests pass.
            
            ---
            🤖 Generated by auto-heal workflow
          labels: |
            dependencies
            security
            auto-heal
            auto-merge
      
      - name: Record to ledger
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p .bick/ledger/$DATE
          cat > .bick/ledger/$DATE/auto-heal-deps-${{ github.run_id }}.json << EOF
          {
            "id": "auto-heal-deps-${{ github.run_id }}",
            "ts": "$(date -Iseconds)",
            "kind": "auto-heal",
            "subject": "dependency-security-fix",
            "payload": {
              "vulnerabilities_before": "${{ steps.audit.outputs.vulnerabilities_before }}",
              "vulnerabilities_after": "${{ steps.audit.outputs.vulnerabilities_after }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}"
            },
            "hash": "auto-heal-$(date +%s)",
            "parentId": null
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .bick/ledger/
          git commit -m "chore: record auto-heal ledger entry [skip ci]" || true
          git push || true

  # Job 2: Dead Code Detection
  dead-code-detection:
    name: Detect and Remove Dead Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -g ts-prune
      
      - name: Run ts-prune
        id: prune
        run: |
          npx ts-prune --error > dead-code-report.txt || echo "Dead code found"
          if [ -s dead-code-report.txt ]; then
            echo "has_dead_code=true" >> $GITHUB_OUTPUT
            echo "Dead code detected:"
            cat dead-code-report.txt
          else
            echo "has_dead_code=false" >> $GITHUB_OUTPUT
            echo "No dead code found"
          fi
        continue-on-error: true
      
      - name: Check for existing issue
        id: check-existing-dead-code
        if: steps.prune.outputs.has_dead_code == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'technical-debt,auto-heal'
            });
            
            const hasExisting = issues.data.some(issue => 
              issue.title === '🧹 Dead Code Detected'
            );
            
            core.setOutput('has_existing', hasExisting);
            return hasExisting;
      
      - name: Create dead code issue
        if: steps.prune.outputs.has_dead_code == 'true' && steps.check-existing-dead-code.outputs.has_existing == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('dead-code-report.txt', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🧹 Dead Code Detected',
              body: `## Dead Code Report\n\nThe following unused exports were detected:\n\n\`\`\`\n${report}\n\`\`\`\n\n**Recommendation:** Review and remove unused exports to reduce bundle size.\n\n---\n🤖 Generated by auto-heal workflow`,
              labels: ['technical-debt', 'auto-heal', 'code-quality']
            });

  # Job 3: Type Safety Improvements
  type-safety:
    name: TypeScript Strict Mode Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma generate
      
      - name: Run TypeScript check
        id: tsc
        run: |
          npx tsc --noEmit 2>&1 | tee type-errors.txt || echo "Type errors found"
          if grep -q "error TS" type-errors.txt; then
            echo "has_type_errors=true" >> $GITHUB_OUTPUT
            echo "error_count=$(grep -c 'error TS' type-errors.txt)" >> $GITHUB_OUTPUT
          else
            echo "has_type_errors=false" >> $GITHUB_OUTPUT
            echo "error_count=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Check for existing issue
        id: check-existing
        if: steps.tsc.outputs.has_type_errors == 'true' && steps.tsc.outputs.error_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'typescript,auto-heal'
            });
            
            const hasExisting = issues.data.some(issue => 
              issue.title === '🔧 TypeScript Errors Detected'
            );
            
            core.setOutput('has_existing', hasExisting);
            return hasExisting;
      
      - name: Create type safety issue
        if: steps.tsc.outputs.has_type_errors == 'true' && steps.tsc.outputs.error_count > 0 && steps.check-existing.outputs.has_existing == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const errors = fs.readFileSync('type-errors.txt', 'utf8');
            const errorLines = errors.split('\n').slice(0, 50).join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔧 TypeScript Errors Detected',
              body: `## TypeScript Type Errors\n\n**Total errors:** ${{ steps.tsc.outputs.error_count }}\n\n### Error Preview (first 50 lines):\n\n\`\`\`\n${errorLines}\n\`\`\`\n\n**Action needed:** Review and fix type errors to maintain type safety.\n\n---\n🤖 Generated by auto-heal workflow`,
              labels: ['typescript', 'auto-heal', 'code-quality']
            });

  # Job 4: Breaking Change Detection
  breaking-changes:
    name: Detect Breaking Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npx prisma generate
      
      - name: Build current version
        id: build-current
        run: |
          npm run build 2>&1 | tee build-current.log
          echo "build_status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Check for build failures
        if: steps.build-current.outputs.build_status != '0'
        run: |
          echo "::error::Build failed after push. This may be a breaking change."
          exit 1
      
      - name: Run tests
        id: test-current
        run: |
          npm test 2>&1 | tee test-current.log
          echo "test_status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Create breaking change alert
        if: steps.build-current.outputs.build_status != '0' || steps.test-current.outputs.test_status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const buildLog = require('fs').readFileSync('build-current.log', 'utf8').slice(0, 2000);
            const testLog = require('fs').existsSync('test-current.log') 
              ? require('fs').readFileSync('test-current.log', 'utf8').slice(0, 2000)
              : 'No test log available';
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 CRITICAL: Breaking Change Detected',
              body: `## ⚠️ Breaking Change Alert\n\nA recent push has caused build or test failures.\n\n**Commit:** ${context.sha}\n**Branch:** ${context.ref}\n\n### Build Log (excerpt):\n\`\`\`\n${buildLog}\n\`\`\`\n\n### Test Log (excerpt):\n\`\`\`\n${testLog}\n\`\`\`\n\n**Action required:** Immediate investigation and fix needed.\n\n---\n🤖 Generated by auto-heal workflow`,
              labels: ['critical', 'breaking-change', 'auto-heal']
            });

  # Job 5: Auto-merge PR with auto-merge label
  auto-merge:
    name: Auto-merge Labeled PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for auto-merge label
        id: check-label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const hasAutoMerge = labels.includes('auto-merge');
            core.setOutput('should_auto_merge', hasAutoMerge);
            return hasAutoMerge;
      
      - name: Wait for checks
        if: steps.check-label.outputs.should_auto_merge == 'true'
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: '.*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      
      - name: Enable auto-merge
        if: steps.check-label.outputs.should_auto_merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
