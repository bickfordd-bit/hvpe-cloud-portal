name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to protect'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - mobile

permissions:
  contents: write
  administration: write

jobs:
  setup-protection:
    name: Configure Branch Protection
    runs-on: ubuntu-latest
    steps:
      - name: Configure branch protection for ${{ inputs.branch }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ inputs.branch }}';

            console.log(`🔒 Setting up branch protection for: ${branch}`);

            const protection = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: branch,
              required_status_checks: {
                strict: true,
                contexts: [
                  'Lint',
                  'Build',
                  'Test'
                ]
              },
              enforce_admins: false,  // Allow owner to bypass
              required_pull_request_reviews: null,  // No required reviews for owner
              restrictions: null,  // No push restrictions
              required_linear_history: false,
              allow_force_pushes: false,
              allow_deletions: false,
              required_conversation_resolution: false
            };

            try {
              await github.rest.repos.updateBranchProtection(protection);
              console.log('✅ Branch protection configured successfully');
              console.log(JSON.stringify(protection, null, 2));
            } catch (error) {
              console.error('❌ Failed to configure branch protection:', error.message);

              // Try to provide helpful error message
              if (error.message.includes('Resource not accessible')) {
                console.log('\n⚠️  This workflow requires admin permissions.');
                console.log('Please ensure GITHUB_TOKEN has admin access or use a PAT with admin scope.');
              }

              throw error;
            }

      - name: Verify branch protection
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ inputs.branch }}';

            try {
              const { data: protection } = await github.rest.repos.getBranchProtection({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branch
              });

              console.log('✅ Branch protection verified:');
              console.log(`- Required status checks: ${protection.required_status_checks?.contexts?.join(', ') || 'none'}`);
              console.log(`- Required reviews: ${protection.required_pull_request_reviews?.required_approving_review_count || 0}`);
              console.log(`- Allow force pushes: ${protection.allow_force_pushes?.enabled || false}`);
              console.log(`- Allow deletions: ${protection.allow_deletions?.enabled || false}`);

            } catch (error) {
              console.error('Failed to verify branch protection:', error.message);
              throw error;
            }

      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🔒 Branch Protection Setup Complete

          **Branch**: \`${{ inputs.branch }}\`

          ### Configuration Applied:
          - ✅ Required status checks: Lint, Build, Test
          - ✅ Strict status checks (must be up-to-date before merge)
          - ✅ No required PR reviews (owner can self-merge)
          - ✅ Force pushes disabled
          - ✅ Branch deletions disabled
          - ✅ Admin bypass enabled (owner can push directly)

          ### Auto-Merge Behavior:
          - Owner PRs will auto-approve when checks pass
          - Auto-merge uses squash strategy
          - Branch auto-deletes after merge
          - Add \`[no-auto-merge]\` to PR title to disable

          EOF
