name: BCS Scorer

on:
  # Allow manual triggering
  workflow_dispatch:
  
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

jobs:
  score:
    name: Compute BCS Score
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run BCS scorer
        run: npm run bick:score
        continue-on-error: true
      
      - name: Upload BCS canon outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bcs-canon-${{ github.run_number }}
          path: .bick/canon/
          retention-days: 90
          if-no-files-found: warn
      
      - name: Display score summary
        if: always()
        run: |
          if [ -f .bick/canon/bcs-latest.json ]; then
            echo "## BCS Score Summary" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat .bick/canon/bcs-latest.json | jq '{BCS, BCS_model, EvidenceWeight, evidenceLevel: .evidenceBreakdown.level, totalEvents}' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No BCS score generated (empty ledger or error)" >> $GITHUB_STEP_SUMMARY
          fi
