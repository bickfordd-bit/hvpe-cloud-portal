version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bickford-postgres
    environment:
      POSTGRES_USER: bickford
      POSTGRES_PASSWORD: bickford
      POSTGRES_DB: bickford
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bickford"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bickford-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
