version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bickford-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bickford}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bickford}
      POSTGRES_DB: ${POSTGRES_DB:-bickford}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bickford"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bickford-network

  redis:
    image: redis:7-alpine
    container_name: bickford-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bickford-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bickford-api-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bickford}:${POSTGRES_PASSWORD:-bickford}@postgres:5432/${POSTGRES_DB:-bickford}
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      WS_PORT: 3002
    ports:
      - "3001:3001"
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bickford-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: bickford-worker-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bickford}:${POSTGRES_PASSWORD:-bickford}@postgres:5432/${POSTGRES_DB:-bickford}
      REDIS_URL: redis://redis:6379
      WS_URL: ws://api:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - bickford-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: bickford-web-prod
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NEXT_PUBLIC_WS_URL: ws://api:3002
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - bickford-network

  nginx:
    image: nginx:alpine
    container_name: bickford-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - bickford-network

volumes:
  postgres_data:

networks:
  bickford-network:
    driver: bridge
